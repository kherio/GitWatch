name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Etiqueta a publicar como release (p. ej. v0.1.0). Vacío = solo compilar"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # necesario para crear la release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # El runner ya trae el SDK de Android; solo aseguramos licencias, plataforma y build-tools.
      - name: Preparar Android SDK
        run: |
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1 || true)
          echo "sdkmanager: ${SDKM:-no encontrado}"
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null || true
            "$SDKM" "platforms;android-35" "build-tools;35.0.0" || true
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Firma opcional con los mismos secretos que OpGram: KEYSTORE_B64, KEYSTORE_PASS, KEY_PASS y KEY_ALIAS.
      # Sin ellos se firma con la clave de debug (cambiará en cada ejecución: no sirve para actualizar encima).
      - name: Preparar keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Compilar release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASS }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Renombrar APK
        env:
          VERSION: ${{ inputs.release_tag || github.ref_name }}
        run: |
          NAME="GitWatch-${VERSION//\//-}.apk"
          mv app/build/outputs/apk/release/*.apk "app/build/outputs/apk/release/$NAME"
          ls -l app/build/outputs/apk/release/

      - uses: actions/upload-artifact@v4
        with:
          name: GitWatch-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: GitWatch ${{ inputs.release_tag || github.ref_name }}
          files: app/build/outputs/apk/release/*.apk
          body: |
            Versión de prueba de GitWatch: vigila las releases de GitHub de tus apps y módulos root y te avisa de las actualizaciones.

            - Requiere Android 11 o superior.
            - Los módulos root y la instalación silenciosa necesitan root (KernelSU, ReSukiSU, Magisk o APatch).
            - Si no hay clave de firma configurada en el repo, la APK va firmada con clave de debug: desinstala antes de instalar una versión firmada con otra clave.
